name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  patches:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v5
        with:
          path: patches/src/main/resources/edge-devtools-frontend.zip
          key: edge-devtools-${{ runner.os }}-${{ hashFiles('scripts/build-devtools-frontend.ts', 'scripts/devtools-mobile.js') }}

      - name: Build Android patch bundle
        shell: pwsh
        run: .\scripts\build.ps1 -CpuCount ([Environment]::ProcessorCount)

      - uses: actions/upload-artifact@v6
        with:
          name: edge-revanced-rvp
          path: patches/build/libs/*.rvp
          if-no-files-found: error
